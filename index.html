                <span data-t="to"></span>

          <div class="result-heading">
            <p class="section-kicker" data-t="atGlance"></p>
            <h2 id="summary-heading"><span id="summary-context"></span></h2>
          </div>

          <section class="measures-composition" aria-labelledby="measures-heading">
            <h3 id="measures-heading" class="visually-hidden" data-t="keyMeasures"></h3>
            <div class="cards-grid">
              <article class="metric-card metric-card-hours">
                <div id="alarm-time-value" class="metric-value"></div>
                <div class="card-title-row">
                  <h3 data-t="alarmTime"></h3>
                  <button type="button" data-info="alarm" class="info-button" data-t-aria-label="indicatorInfo">i</button>
                </div>
                <p id="alarm-time-context" class="metric-context"></p>
              </article>

              <article class="metric-card metric-card-share">
                <div id="alarm-time-secondary" class="metric-value"></div>
                <div class="card-title-row">
                  <h3 data-t="alarmShare"></h3>
                  <button type="button" data-info="alarm" class="info-button" data-t-aria-label="indicatorInfo">i</button>
                </div>
              </article>

              <article class="metric-card metric-card-days">
                <div id="affected-days-secondary" class="metric-value"></div>
                <div class="card-title-row">
                  <h3 data-t="affectedDays"></h3>
                  <button type="button" data-info="days" class="info-button" data-t-aria-label="indicatorInfo">i</button>

              <div>
                <span class="episode-label" data-t="episodes"></span>
                <button type="button" data-info="episodes" class="info-button" data-t-aria-label="indicatorInfo">i</button>
              </div>
              <strong id="episodes-value"></strong>
              <span id="episodes-secondary" class="metric-secondary"></span>
              <p id="episodes-context" class="metric-context"></p>
            </article>

            <p id="aggregation-note" class="aggregation-note"></p>
          </div>
        </div>

        <section class="hero-map" aria-labelledby="places-heading">
          <div class="map-heading-row">
            <div>
              <p class="section-kicker" data-t="acrossPlaces"></p>
              <h2 id="places-heading" data-t="map"></h2>
            </div>
            <div class="map-controls">
              <label for="map-measure">
                <span data-t="colourBy"></span>
                <select id="map-measure">
                  <option value="school_time_under_alarm_pct" data-t="alarmShare"></option>
                  <option value="alarm_hours_average_school_location" data-t="hours"></option>
                  <option value="affected_school_days_pct" data-t="daysShare"></option>
